# /etc/nginx/sites-available/megamall-shop  (customer shop: Next.js running on port 3000)
# Enable: ln -s /etc/nginx/sites-available/megamall-shop /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name megamall.co.tz www.megamall.co.tz;

    # Always use the address without www.
    if ($host = www.megamall.co.tz) {
        return 301 https://megamall.co.tz$request_uri;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
